# Generated by SecurityFactory for automation auto-image-push-gate-c0f31e.
# Trigger: Image pushed to registry | Stages: CONTAINER, SBOM | Gate: Block on critical or KEV
# Requires the FACTORY_API_KEY and FACTORY_STORE_TOKEN repository secrets (Settings > Secrets > Actions).
name: Factory Security - Registry image gate

on:
  registry_package:
    types: [published]
  workflow_dispatch:
    inputs:
      image:
        description: Image reference to scan
        required: false
        default: ghcr.io/OWNER/IMAGE:latest

permissions:
  contents: write
  pull-requests: write

jobs:
  factory-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the Droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install the model-fallback runner
        run: |
          cat > "$RUNNER_TEMP/factory-run.sh" <<'PROMPT'
          #!/usr/bin/env bash
          # factory_run <autonomy> <prompt-file>
          #
          # Runs `droid exec` on the primary model, then on each Droid Core fallback if
          # the premium quota is exhausted. Any other failure is reported as-is rather
          # than burning the whole chain on a prompt that is simply broken.
          set -uo pipefail

          factory_run() {
            local autonomy="$1" prompt_file="$2"
            local log model
            log="$(mktemp)"
            # An empty first entry means 'whatever droid defaults to'.
            local -a chain=("${FACTORY_MODEL:-}")
            local -a fallbacks=()
            IFS="," read -ra fallbacks <<< "${FACTORY_FALLBACK_MODELS:-}"
            # ${a[@]+"${a[@]}"} rather than "${a[@]}": the latter trips `set -u` on an
            # empty array under bash 3.x, which is still what some runners ship.
            chain+=(${fallbacks[@]+"${fallbacks[@]}"})

            for model in "${chain[@]}"; do
              local -a model_arg=()
              [ -n "$model" ] && model_arg=(-m "$model")
              if droid exec --auto "$autonomy" ${model_arg[@]+"${model_arg[@]}"} "$(cat "$prompt_file")" 2>&1 | tee "$log"; then
                rm -f "$log"
                return 0
              fi
              if ! grep -qiE "rate limit|quota|usage limit|insufficient credit|too many requests|429|402" "$log"; then
                echo "::error::droid exec failed on ${model:-the default model}" >&2
                rm -f "$log"
                return 1
              fi
              echo "::warning::${model:-the default model} is out of quota" >&2
            done
            echo "::error::every model in the fallback chain was out of quota" >&2
            rm -f "$log"
            return 1
          }
          PROMPT
          chmod 0555 "$RUNNER_TEMP/factory-run.sh"

      - name: Resolve the pushed image
        run: |
          IMAGE="${{ github.event.registry_package.package_version.package_url }}"
          [ -n "$IMAGE" ] || IMAGE="${{ inputs.image }}"
          echo "FACTORY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Scanning $IMAGE"

      - name: Factory CONTAINER scan
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
          FACTORY_FALLBACK_MODELS: ${{ vars.FACTORY_FALLBACK_MODELS || 'glm-5.2,kimi-k2.7-code' }}
        run: |
          cat > prompt-container.md <<'PROMPT'
          Run a Factory-native CONTAINER security scan.

          ## Scope
          Container security. Inspect Dockerfiles, image build configs, and Kubernetes workloads for container misconfigurations: running as root, missing USER directive, no read-only filesystem, exposed sensitive ports, secrets baked into image layers, unscanned or untrusted base images, missing healthchecks, and overly broad volume mounts. Set `location` to the Dockerfile line and `recommended_fix` to the concrete hardening change.

          ## Event scope
          Scope this scan to the image that was just pushed, at the digest named in the event. Inspect its layers and package inventory, and the Dockerfile in the source repo that builds it. A finding must be present in this image.

          ## Verification bar
          Every finding must survive three passes: (0) a candidate anchored to a real file:line or layer, (1) an adversarial argument that it is NOT exploitable, (2) a traced data flow from a real entry point to the sink. Drop anything that fails a pass. Never report a finding you cannot point at a line for.

          ## Gate
          This scan is gated: Block on critical or KEV. A critical finding, or any known-exploited CVE, fails the gate. Assign severity from exploitability in this target, per a strict rubric - do not inflate a finding to force a block or soften one to let a change through.

          ## Output
          Write `factory-findings-container.json` containing {"findings": [...]}, where each finding has: title, category, severity (critical|high|medium|low), location (file:line), details, impact, recommended_fix, confidence, evidence, verification. Use an empty array if nothing is substantiated.
          Also append a short Markdown section to `factory-report.md`: the stage name, a table of findings (severity, title, location, fix), and one summary line.
          Do not modify any other file. Do not commit, push, or open a pull request.
          PROMPT
          source "$RUNNER_TEMP/factory-run.sh"
          factory_run medium prompt-container.md
          test -f factory-findings-container.json || echo '{"findings": []}' > factory-findings-container.json

      - name: Factory SBOM scan
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
          FACTORY_FALLBACK_MODELS: ${{ vars.FACTORY_FALLBACK_MODELS || 'glm-5.2,kimi-k2.7-code' }}
        run: |
          cat > prompt-sbom.md <<'PROMPT'
          Run a Factory-native SBOM security scan.

          ## Scope
          Software Bill of Materials + vulnerability + license. Build and assess the SBOM: enumerate every direct and transitive component from dependency manifests/lockfiles (requirements*.txt, pyproject.toml, poetry.lock, Pipfile.lock, package.json, package-lock.json, yarn.lock, pnpm-lock.yaml, go.mod/go.sum, Cargo.lock, Gemfile.lock, pom.xml, build.gradle) AND the OS/package inventory declared by Dockerfiles/base images (apt/apk/dnf installed packages, base image tags). For each component identify: known CVEs/GHSAs at the pinned version, base images pinned to vulnerable or end-of-life tags, missing digest/lockfile pins that could drift into a vulnerable range, and license compliance (copyleft GPL/AGPL, unapproved or unknown licenses, license conflicts with the project license). Set `location` to the manifest/Dockerfile line and version, cite the advisory id in `details`, and set `recommended_fix` to the minimum safe fixed version or patched base image tag. Only report components you can substantiate as vulnerable or noncompliant.

          ## Event scope
          Scope this scan to the image that was just pushed, at the digest named in the event. Inspect its layers and package inventory, and the Dockerfile in the source repo that builds it. A finding must be present in this image.

          ## Verification bar
          Every finding must survive three passes: (0) a candidate anchored to a real file:line or layer, (1) an adversarial argument that it is NOT exploitable, (2) a traced data flow from a real entry point to the sink. Drop anything that fails a pass. Never report a finding you cannot point at a line for.

          ## Gate
          This scan is gated: Block on critical or KEV. A critical finding, or any known-exploited CVE, fails the gate. Assign severity from exploitability in this target, per a strict rubric - do not inflate a finding to force a block or soften one to let a change through.

          ## Output
          Write `factory-findings-sbom.json` containing {"findings": [...]}, where each finding has: title, category, severity (critical|high|medium|low), location (file:line), details, impact, recommended_fix, confidence, evidence, verification. Use an empty array if nothing is substantiated.
          Also append a short Markdown section to `factory-report.md`: the stage name, a table of findings (severity, title, location, fix), and one summary line.
          Do not modify any other file. Do not commit, push, or open a pull request.
          PROMPT
          source "$RUNNER_TEMP/factory-run.sh"
          factory_run medium prompt-sbom.md
          test -f factory-findings-sbom.json || echo '{"findings": []}' > factory-findings-sbom.json

      - name: Apply the gate
        id: gate
        run: |
          BLOCKING=0
          for file in factory-findings-*.json; do
            [ -f "$file" ] || continue
            count=$(jq '[.findings[]? | (.severity // "" | ascii_downcase) as $s | select((($s == "critical")) or ((.kev == true) or ((.title + " " + (.details // "")) | ascii_downcase | test("kev|known exploited"))))] | length' "$file")
            BLOCKING=$((BLOCKING + ${count:-0}))
          done
          echo "Gate: Block on critical or KEV -> $BLOCKING blocking finding(s)"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"

      - name: Open a remediation pull request
        if: ${{ steps.gate.outputs.blocking != '0' }}
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
          FACTORY_FALLBACK_MODELS: ${{ vars.FACTORY_FALLBACK_MODELS || 'glm-5.2,kimi-k2.7-code' }}
        run: |
          cat > prompt-fix.md <<'PROMPT'
          The CONTAINER, SBOM gate blocked this change. Fix the blocking findings listed in factory-findings-*.json.

          - Make the smallest correct change that removes each vulnerability: version bumps, digest pins, tightened permissions, added validation or encoding.
          - No refactors, no reformatting, no unrelated upgrades.
          - Secrets: remove or parameterize the credential in code and state in the PR body that a human must rotate it. Never commit a replacement secret.
          - Validate what is cheap to validate (build, tests, lint) and record what you ran.
          - Create branch `factory/automation-fix-$GITHUB_RUN_ID`, commit, push, and open one review-ready pull request against the default branch with `gh pr create`. Never push to a default branch, never force-push, never merge.
          - List anything you deliberately skipped, with the reason, under `## Skipped`.

          Return {"pull_requests": [{"repo": "...", "url": "..."}], "skipped": ["..."]} then one summary line.
          PROMPT
          source "$RUNNER_TEMP/factory-run.sh"
          factory_run high prompt-fix.md

      - name: Publish the findings to the SecurityFactory store
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # The gate verdict is already computed and (if blocking) will fail the job in
          # _fail_step below; publishing to the dashboard is a separate, best-effort
          # concern. A missing token must never mask or block the gate, so bail here
          # with a warning instead of letting the clone/push below fail the whole job.
          if [ -z "${{ secrets.FACTORY_STORE_TOKEN }}" ]; then
            echo "::warning::FACTORY_STORE_TOKEN is not set, so these findings were not published to the SecurityFactory dashboard. Add the FACTORY_STORE_TOKEN repository secret to enable publishing." >&2
            exit 0
          fi

          STAMP="$(date -u +%Y-%m-%dT%H-%M-%S+00-00)"
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          SLUG="$(echo "${GITHUB_REPOSITORY}" | tr "[:upper:]/" "[:lower:]-")"

          # `complete` is per push, computed in _publish_stage_block, and false when
          # either half of the picture is missing: the gate never produced a verdict
          # for the whole run (GATE_COMPLETE below), or this stage's own findings
          # file never landed (checked per stage). Silence in either case means
          # "we did not look", not "fixed" -- one stage's failure must never mark a
          # sibling stage's push incomplete.
          GATE_COMPLETE=true
          [ -n "${{ steps.gate.outputs.blocking }}" ] || GATE_COMPLETE=false
          BLOCKING="${{ steps.gate.outputs.blocking }}"
          [ -n "$BLOCKING" ] || BLOCKING=0
          VERDICT=pass
          [ "$BLOCKING" = "0" ] || VERDICT=fail

          mkdir -p "$RUNNER_TEMP/factory-pushes"

          STAGE="container"
          PUSH_ID="$(openssl rand -hex 4)"
          if jq '.findings // []' factory-findings-container.json > stage-findings-container.json 2>/dev/null; then
            STAGE_COMPLETE=true
          else
            echo '[]' > stage-findings-container.json
            STAGE_COMPLETE=false
          fi
          COMPLETE=true
          [ "$GATE_COMPLETE" = true ] || COMPLETE=false
          [ "$STAGE_COMPLETE" = true ] || COMPLETE=false
          jq -n \
            --arg push_id "$PUSH_ID" \
            --arg run_id "run-${STAGE}-${PUSH_ID}" \
            --arg stage "$STAGE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --arg commit "$GITHUB_SHA" \
            --arg completed_at "$COMPLETED_AT" \
            --arg policy "critical_or_kev" \
            --argjson blocking "$BLOCKING" \
            --arg verdict "$VERDICT" \
            --argjson complete "$COMPLETE" \
            --argjson pr "${{ github.event.pull_request.number || 0 }}" \
            --argjson run_number "${{ github.run_id }}" \
            --arg workflow "${{ github.workflow }}" \
            --argjson findings "$(cat stage-findings-container.json)" \
            '{schema: 1, push_id: $push_id, scan: {run_id: $run_id, stage: $stage, targets: [{"kind": "repo", "value": $repo}], source: "ci", complete: $complete, gate: {policy: $policy, blocking: $blocking, verdict: $verdict}, repository: $repo, branch: $branch, commit: $commit, pull_request: (if $pr == 0 then null else $pr end), workflow: {name: $workflow, run_id: $run_number, url: ("https://github.com/" + $repo + "/actions/runs/" + ($run_number|tostring))}, completed_at: $completed_at}, findings: $findings}' \
            > "$RUNNER_TEMP/factory-pushes/${STAMP}__container__${SLUG}__${PUSH_ID}.json"

          STAGE="sbom"
          PUSH_ID="$(openssl rand -hex 4)"
          if jq '.findings // []' factory-findings-sbom.json > stage-findings-sbom.json 2>/dev/null; then
            STAGE_COMPLETE=true
          else
            echo '[]' > stage-findings-sbom.json
            STAGE_COMPLETE=false
          fi
          COMPLETE=true
          [ "$GATE_COMPLETE" = true ] || COMPLETE=false
          [ "$STAGE_COMPLETE" = true ] || COMPLETE=false
          jq -n \
            --arg push_id "$PUSH_ID" \
            --arg run_id "run-${STAGE}-${PUSH_ID}" \
            --arg stage "$STAGE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --arg commit "$GITHUB_SHA" \
            --arg completed_at "$COMPLETED_AT" \
            --arg policy "critical_or_kev" \
            --argjson blocking "$BLOCKING" \
            --arg verdict "$VERDICT" \
            --argjson complete "$COMPLETE" \
            --argjson pr "${{ github.event.pull_request.number || 0 }}" \
            --argjson run_number "${{ github.run_id }}" \
            --arg workflow "${{ github.workflow }}" \
            --argjson findings "$(cat stage-findings-sbom.json)" \
            '{schema: 1, push_id: $push_id, scan: {run_id: $run_id, stage: $stage, targets: [{"kind": "repo", "value": $repo}], source: "ci", complete: $complete, gate: {policy: $policy, blocking: $blocking, verdict: $verdict}, repository: $repo, branch: $branch, commit: $commit, pull_request: (if $pr == 0 then null else $pr end), workflow: {name: $workflow, run_id: $run_number, url: ("https://github.com/" + $repo + "/actions/runs/" + ($run_number|tostring))}, completed_at: $completed_at}, findings: $findings}' \
            > "$RUNNER_TEMP/factory-pushes/${STAMP}__sbom__${SLUG}__${PUSH_ID}.json"

          git clone --depth 1 "https://x-access-token:${{ secrets.FACTORY_STORE_TOKEN }}@github.com/0snug0/SecurityFactory.git" store-repo
          cd store-repo
          git config user.name "factory-security[bot]"
          git config user.email "factory-security@users.noreply.github.com"
          mkdir -p data/store/pushes
          cp "$RUNNER_TEMP"/factory-pushes/*.json data/store/pushes/
          git add data/store/pushes
          # [skip ci] so the store repo does not re-scan a data commit.
          git commit -m "Record container, sbom findings from ${GITHUB_REPOSITORY} [skip ci]"

          # Every push is a new uniquely named file, so a rebase always applies.
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              PUSHED=true
              break
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase
          done
          # A `git push && break` loop never trips `bash -e` on its own -- the loop's
          # last command on a failed attempt is a succeeding `git pull --rebase`, so
          # exhausting every attempt has to be reported and failed explicitly here,
          # or CI goes green while the findings are never published.
          if [ "$PUSHED" != true ]; then
            echo "::error::could not publish findings to the SecurityFactory store after 5 attempts" >&2
            exit 1
          fi

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-findings
          path: |
            factory-findings-*.json
            factory-report.md
          if-no-files-found: ignore

      - name: Fail the check on a blocking verdict
        if: ${{ steps.gate.outputs.blocking != '0' }}
        run: |
          echo "Block on critical or KEV: ${{ steps.gate.outputs.blocking }} blocking finding(s)." >&2
          exit 1
